name: Upload wheels on release

# Runs whenever a GitHub Release is published. Builds the nlp_pipeline wheel,
# resolves + downloads/builds wheels for every dependency (pandas,
# scikit-learn, numpy, and their transitive deps like scipy/joblib), zips
# them all up, and attaches the zip to that same release as a downloadable
# asset.
on:
  release:
    types: [published]
  workflow_dispatch:

# Needed so the workflow's GITHUB_TOKEN can upload an asset to the release.
permissions:
  contents: write

jobs:
  build-and-upload-wheels:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel

      - name: Build nlp_pipeline wheel and all dependency wheels
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wheelhouse | Out-Null
          # `pip wheel .` builds a wheel for the local package (from
          # pyproject.toml in the repo root) AND resolves + builds/downloads
          # a wheel for every runtime dependency, transitively, into the
          # same output directory.
          pip wheel . -w wheelhouse

      - name: Zip wheelhouse
        id: zip
        shell: pwsh
        run: |
          $tagName = "${{ github.event.release.tag_name }}"
          if (-not $tagName) {
            $tagName = "${{ github.ref_name }}"
          }
          $zipName = "nlp_pipeline-wheels-$tagName.zip"
          Set-Location wheelhouse
          Compress-Archive -Path .\* -DestinationPath ..\$zipName -Force
          Set-Location ..
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: ${{ steps.zip.outputs.zip_name }}
